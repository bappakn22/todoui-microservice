apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: todo-frontend-ingress
  namespace: todo-app
  annotations:
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"

spec:
  ingressClassName: azure-application-gateway

  rules:
     - host: todo-ui.anihub.shop
       http:
         paths:
           - path: /
             pathType: Prefix
             backend:
               service:
                 name: todo-frontend-service
                 port:
                   number: 80