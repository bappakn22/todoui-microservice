name: Todo Frontend Deploy

on:
  workflow_dispatch: 

permissions: 
  id-token: write
  contents: read

jobs:
  azure-login-test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          
      - name: check azure commands
        run: |
          az account show
          az account show --output table
          az acr show --name acrtodoappbappa --output table
          az acr show --name acrtodoappbappa --query loginServer --output tsv
          az role assignment list --assignee 99540b96-fa8e-43ae-a229-7eb2aea8f9fa --all --include-inherited --output table




    
